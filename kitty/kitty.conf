# ~/.config/kitty/kitty.conf - Nord theme
# Palette: https://www.nordtheme.com/docs/colors-and-palettes

#: Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures never

#: Cursor
cursor_shape          block
cursor_blink_interval 0

#: Scrollback
scrollback_lines 5000

#: Mouse
copy_on_select     yes
mouse_hide_wait    3.0
url_style          curly
detect_urls        yes

#: Window
window_padding_width 8
remember_window_size no
initial_window_width  100c
initial_window_height 30c
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.0

#: Shell
shell fish

#: Tabs
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #2E3440
active_tab_background   #88C0D0
active_tab_font_style   bold
inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252
tab_bar_background      #2E3440

#: Nord colors
foreground            #D8DEE9
background            #2E3440
selection_foreground  #2E3440
selection_background  #88C0D0
url_color             #88C0D0
cursor                #D8DEE9
cursor_text_color     #2E3440
active_border_color   #88C0D0
inactive_border_color #3B4252
bell_border_color     #EBCB8B

# black
color0  #3B4252
color8  #4C566A
# red
color1  #BF616A
color9  #BF616A
# green
color2  #A3BE8C
color10 #A3BE8C
# yellow
color3  #EBCB8B
color11 #EBCB8B
# blue
color4  #81A1C1
color12 #81A1C1
# magenta
color5  #B48EAD
color13 #B48EAD
# cyan
color6  #88C0D0
color14 #8FBCBB
# white
color7  #E5E9F0
color15 #ECEFF4

#: Keyboard shortcuts
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
